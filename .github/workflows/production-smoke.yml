name: Production Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL \
            --output /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_SERVICE_TOKEN_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_SERVICE_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$TUNNEL_SERVICE_TOKEN_ID"
          test -n "$TUNNEL_SERVICE_TOKEN_SECRET"
          cat >> ~/.ssh/config <<EOF
          Host ai-trade-production
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Check ai-runner and remove Claude token
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_SERVICE_TOKEN_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_SERVICE_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          ssh ai-trade-production <<'REMOTE'
          set -euo pipefail

          cd /opt/ai-trade

          COMPOSE_ENV_ARGS=()
          if [ -f .env.production ]; then
            COMPOSE_ENV_ARGS=(--env-file .env.production)
          fi
          COMPOSE_FILE_ARGS=(-f docker/compose.yml)
          TOKEN_KEYS='ANTHROPIC_AUTH_TOKEN|ANTHROPIC_API_KEY|CLAUDE_CODE_OAUTH_TOKEN|CLAUDE_API_KEY'

          printf 'vm git head=%s\n' "$(git rev-parse HEAD)"

          container_id="$(docker compose "${COMPOSE_FILE_ARGS[@]}" "${COMPOSE_ENV_ARGS[@]}" ps -q ai-runner || true)"
          if [ -z "$container_id" ]; then
            echo 'ai-runner status before: not running'
          else
            docker inspect --format 'ai-runner status before: status={{.State.Status}} running={{.State.Running}}{{if .State.Health}} health={{.State.Health.Status}}{{end}}' "$container_id"
          fi

          docker compose "${COMPOSE_FILE_ARGS[@]}" "${COMPOSE_ENV_ARGS[@]}" stop ai-runner >/dev/null 2>&1 || true

          container_id="$(docker compose "${COMPOSE_FILE_ARGS[@]}" "${COMPOSE_ENV_ARGS[@]}" ps -q ai-runner || true)"
          if [ -z "$container_id" ]; then
            echo 'ai-runner status after stop: not running'
          else
            docker inspect --format 'ai-runner status after stop: status={{.State.Status}} running={{.State.Running}}{{if .State.Health}} health={{.State.Health.Status}}{{end}}' "$container_id"
          fi

          if [ -f .env.production ]; then
            before_count="$(grep -Ec "^(${TOKEN_KEYS})=" .env.production || true)"
            if [ "$before_count" -gt 0 ]; then
              backup=".env.production.bak.remove-claude-token-$(date +%Y%m%d%H%M%S)"
              cp -p .env.production "$backup"
              tmp="$(mktemp)"
              grep -Ev "^(${TOKEN_KEYS})=" .env.production > "$tmp" || true
              install -m 600 "$tmp" .env.production
              rm -f "$tmp"
              echo "local env token keys removed: $before_count (backup: $backup)"
            else
              echo 'local env token keys removed: 0'
            fi
          else
            echo 'local env file missing: .env.production'
          fi

          if [ -r .infisical-bootstrap.env ]; then
            # shellcheck disable=SC1091
            . ./.infisical-bootstrap.env
            api="${INFISICAL_API_URL:-}"
            project="${INFISICAL_PROJECT_ID:-}"
            client_id="${INFISICAL_CLIENT_ID:-}"
            client_secret="${INFISICAL_CLIENT_SECRET:-}"
            unset INFISICAL_API_URL INFISICAL_PROJECT_ID INFISICAL_CLIENT_ID INFISICAL_CLIENT_SECRET

            if [ -n "$api" ] && [ -n "$project" ] && [ -n "$client_id" ] && [ -n "$client_secret" ]; then
              token="$(printf '{"clientId":"%s","clientSecret":"%s"}' "$client_id" "$client_secret" \
                | curl -fsS --max-time 20 -X POST "$api/api/v1/auth/universal-auth/login" \
                    -H 'Content-Type: application/json' --data @- 2>/dev/null \
                | jq -r '.accessToken // empty')" || true

              if [ -n "${token:-}" ]; then
                for key in ANTHROPIC_AUTH_TOKEN ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN CLAUDE_API_KEY; do
                  body="$(jq -cn --arg environment prod --arg workspaceId "$project" \
                    '{environment:$environment,workspaceId:$workspaceId,secretPath:"/",type:"shared"}')"
                  code="$(curl -sS --max-time 20 -o /tmp/infisical-delete-response.json -w '%{http_code}' \
                    -X DELETE "$api/api/v3/secrets/raw/$key" \
                    -H "Authorization: Bearer $token" \
                    -H 'Content-Type: application/json' \
                    --data "$body" || true)"
                  if [ "$code" = "200" ] || [ "$code" = "204" ]; then
                    echo "infisical delete $key: deleted"
                  elif [ "$code" = "404" ]; then
                    echo "infisical delete $key: not found"
                  else
                    echo "infisical delete $key: http $code"
                  fi
                done
              else
                echo 'infisical delete: auth failed'
              fi
            else
              echo 'infisical delete: bootstrap incomplete'
            fi
          else
            echo 'infisical delete: bootstrap not readable'
          fi

          REMOTE
