services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AI_TRADE_POSTGRES_DB:-ai_trade}
      POSTGRES_USER: ${AI_TRADE_POSTGRES_USER:-ai_trade}
      POSTGRES_PASSWORD: ${AI_TRADE_POSTGRES_PASSWORD:-ai_trade}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  next-web:
    build:
      context: .
      target: next-web
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql://${AI_TRADE_POSTGRES_USER:-ai_trade}:${AI_TRADE_POSTGRES_PASSWORD:-ai_trade}@timescaledb:5432/${AI_TRADE_POSTGRES_DB:-ai_trade}
      WORKER_INTERNAL_URL: http://worker:8787
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${AI_TRADE_WEB_HOST_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/trpc/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql://${AI_TRADE_POSTGRES_USER:-ai_trade}:${AI_TRADE_POSTGRES_PASSWORD:-ai_trade}@timescaledb:5432/${AI_TRADE_POSTGRES_DB:-ai_trade}
      WORKER_PORT: "8787"
      AI_RUNNER_INTERNAL_URL: http://ai-runner:8788
    depends_on:
      ai-runner:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8787/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db-migrate:
    build:
      context: .
      target: db-migrate
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql://${AI_TRADE_POSTGRES_USER:-ai_trade}:${AI_TRADE_POSTGRES_PASSWORD:-ai_trade}@timescaledb:5432/${AI_TRADE_POSTGRES_DB:-ai_trade}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ai-runner:
    build:
      context: .
      target: ai-runner
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      AI_RUNNER_PORT: "8788"
      CLAUDE_CONFIG_DIR: /home/node/.claude
    volumes:
      - ./secrets/claude:/home/node/.claude:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8788/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  timescaledb-data:
